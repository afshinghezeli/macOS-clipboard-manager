name: Beta

# Publishes a beta from main: a GitHub pre-release and an appcast entry on Sparkle's "beta"
# channel, which only people who turned on "Include beta versions" are offered. Betas leave
# version.txt and CHANGELOG.md alone and never go to Homebrew (docs/releasing.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: The beta's version, e.g. 0.2.0-beta.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  draft:
    name: Draft the pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the draft release
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Betas are published from main."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "::error::Expected a version like 0.2.0-beta.1, got $VERSION."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Draft the release with the changes since the last version
        id: draft
        run: |
          tag="v$VERSION"
          previous="$(git describe --tags --abbrev=0 --match 'v*' 2> /dev/null || true)"
          {
            echo "A test version of what comes after ${previous:-the first release}. Changes so far:"
            echo
            git log --format='* %s' ${previous:+"$previous..HEAD"} |
              grep -E '^\* (feat|fix|perf)(\([a-z0-9-]+\))?!?: ' || echo "* Fixes and internal changes"
          } > notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A draft left by a failed run is reused; a published beta is never replaced.
          if state="$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null)"; then
            if [[ "$state" == true ]]; then
              echo "::notice::Reusing the draft $tag."
              gh release edit "$tag" --target "$GITHUB_SHA" --notes-file notes.md
              exit 0
            fi
            echo "::error::$tag is already published. Pick the next beta number."
            exit 1
          fi
          gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" --title "$VERSION" \
            --notes-file notes.md

  publish:
    name: Publish
    needs: draft
    permissions:
      contents: write
      pages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.draft.outputs.tag }}
      version: ${{ inputs.version }}
      sha: ${{ github.sha }}
      channel: beta
    secrets: inherit
